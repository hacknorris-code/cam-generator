
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Camera</title>
<style>
  body {
    background: #111;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 20px;
  }

  canvas {
    width: min(90vw, 640px);
    background: black;
    image-rendering: pixelated;
  }

  button, input {
    width: min(90vw, 640px);
  }
</style>
</head>
<body>

<button id="toggle">Start camera</button>

<video id="video" autoplay playsinline
       style="display:none"></video>

<canvas id="canvas"></canvas>

<label>
  Exposure time:
  <span id="exposureValue">10000</span> µs
</label>

<input id="exposure" type="range"
       min="100" max="1000000"
       step="100" value="10000">

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const toggle = document.getElementById("toggle");
const exposure = document.getElementById("exposure");
const exposureValue = document.getElementById("exposureValue");

let stream = null;
let track = null;
let running = false;
let animation = null;

// Start / stop camera
toggle.onclick = async () => {
  if (running) {
    cancelAnimationFrame(animation);
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    track = null;
    running = false;
    toggle.textContent = "Start camera";
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    track = stream.getVideoTracks()[0];

    // Request maximum supported ISO/gain if available.
    const caps = track.getCapabilities();
    const settings = {};

    if (caps.iso) {
      settings.iso = caps.iso.max;
    }

    if (caps.exposureTime) {
      settings.exposureTime = Number(exposure.value);
    }

    if (caps.exposureMode &&
        caps.exposureMode.includes("manual")) {
      settings.exposureMode = "manual";
    }

    if (caps.iso || caps.exposureTime) {
      await track.applyConstraints({
        advanced: [settings]
      });
    }

    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    running = true;
    toggle.textContent = "Stop camera";

    render();

  } catch (err) {
    alert("Camera error: " + err.message);
  }
};

// Exposure slider
exposure.oninput = async () => {
  exposureValue.textContent = exposure.value;

  if (track) {
    try {
      await track.applyConstraints({
        advanced: [{
          exposureTime: Number(exposure.value)
        }]
      });
    } catch (e) {
      console.warn("Exposure control unavailable", e);
    }
  }
};

// Convert RGB to 1 bit per channel
function render() {
  if (!running) return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const frame = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  );

  const data = frame.data;

  for (let i = 0; i < data.length; i += 4) {
    // Keep ONLY the lowest bit of each color channel.
    data[i]     = (data[i]     & 1) * 255;
    data[i + 1] = (data[i + 1] & 1) * 255;
    data[i + 2] = (data[i + 2] & 1) * 255;
  }

  ctx.putImageData(frame, 0, 0);

  animation = requestAnimationFrame(render);
}
</script>

</body>
</html>
